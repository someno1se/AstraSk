<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>AstraSk</title></head><body><main><h1>AstraSk</h1><p>YouTube controls</p><label>테마 <select id="theme"><option value="off">기본</option><option value="dark">다크</option></select></label><label>재생 속도 <select id="speed"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></label><label>영상 확대 <input id="zoom" type="checkbox"></label><label>SponsorBlock <input id="sponsor" type="checkbox"></label><div class="actions"><button id="export">백업</button><button id="import">복원</button><input id="file" type="file" accept="application/json" hidden></div><small id="status"></small></main><script src="popup.js"></script></body></html>
